[project]
id = "mls"
version = "3.0.0"
src = "src"
work = "out/{target.name}/{profile.name}"
mach = "^7"

[target.linux-x86_64]
arch = "x86_64"
sys = "linux"
abi = "sysv64"

[target.linux-aarch64]
arch = "aarch64"
sys = "linux"
abi = "aapcs64"

[target.linux-riscv64]
arch = "riscv64"
sys = "linux"
abi = "lp64d"

[target.windows-x86_64]
arch = "x86_64"
sys  = "windows"
abi  = "win64"
env  = "msvc"

[target.windows-aarch64]
arch = "aarch64"
sys  = "windows"
abi  = "aapcs64win"
env  = "msvc"

[target.darwin-x86_64]
arch = "x86_64"
sys = "darwin"
abi = "sysv64"
env = "macos"

[target.darwin-aarch64]
arch = "aarch64"
sys = "darwin"
abi = "darwinpcs"
env = "macos"

[profile.debug]
default = true
optimize = false
debug = false
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[artifact.mls]
kind = "bin"
entry = "bin/main.mach"
out = "{project.work}/bin/mls{artifact.suffix}"
targets = ["*"]
link = []
need = []

[dep.std]
git = "https://github.com/briar-systems/mach-std"
version = "^10.0.0"

[dep.mach]
git = "https://github.com/briar-systems/mach"
ref = "tag/v7.0.0"

[dep.toml]
git = "https://github.com/briar-systems/mach-toml"
version = "^0.1.0"

[dep.json]
git = "https://github.com/briar-systems/mach-json"
version = "^0.1.0"
