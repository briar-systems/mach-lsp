[project]
id = "mls"
version = "2.1.0"
src = "src"
work = "out/{target.name}/{profile.name}"
mach = "^6"

[target.linux-x86_64]
arch = "x86_64"
sys = "linux"
abi = "sysv64"

[target.linux-arm64]
arch = "aarch64"
sys = "linux"
abi = "aapcs64"

[target.linux-riscv64]
arch = "riscv64"
sys = "linux"
abi = "lp64d"

[target.windows-x86_64]
arch = "x86_64"
sys  = "windows"
abi  = "win64"
env  = "msvc"

[target.darwin-x86_64]
arch = "x86_64"
sys = "darwin"
abi = "sysv64"
env = "macos"

[target.darwin-aarch64]
arch = "aarch64"
sys = "darwin"
abi = "aapcs64"
env = "macos"

[profile.debug]
default = true
optimize = false
debug = false
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[artifact.mls]
kind = "bin"
entry = "bin/main.mach"
out = "{project.work}/bin/mls{artifact.suffix}"
targets = ["*"]
link = []
need = []

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/dev"

[dep.mach]
git = "https://github.com/briar-systems/mach"
ref = "branch/dev"
