name: Release

# asset names are part of the contract editor extensions download by:
#   mls-<version>-<asset>.tar.gz   (linux, darwin)
#   mls-<version>-<asset>.zip      (windows)
#   RELEASES.json                  every installable mls version and the mach it links
#   SHA256SUMS

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  MACH_VERSION: 6.8.0

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("mach.toml", "rb"))["project"]["version"])')
          [ "$TAG" = "v$version" ] || { echo "::error::tag $TAG does not match mach.toml version $version"; exit 1; }

  # the hosts this project ships to, tested natively before anything is published
  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml
    with:
      profile: release
      runners: '["ubuntu-latest", "ubuntu-24.04-arm", "windows-latest", "macos-15", "macos-15-intel"]'

  # mls built natively on each host it ships to, archived under the asset name the contract fixes
  package:
    needs: verify
    name: package (${{ matrix.asset }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    target: linux-x86_64,   asset: x86_64-linux }
          - { runner: ubuntu-24.04-arm, target: linux-arm64,    asset: aarch64-linux }
          - { runner: windows-latest,   target: windows-x86_64, asset: x86_64-windows }
          - { runner: macos-15,         target: darwin-aarch64, asset: aarch64-darwin }
          - { runner: macos-15-intel,   target: darwin-x86_64,  asset: x86_64-darwin }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: install mach
        run: |
          export MACH_INSTALL_DIR="$RUNNER_TEMP/mach"
          url="https://raw.githubusercontent.com/briar-systems/mach/v$MACH_VERSION/dist"
          if [ "$RUNNER_OS" = Windows ]; then
            pwsh -NoProfile -Command "irm $url/install.ps1 | iex"
          else
            curl -fsSL "$url/install.sh" | sh
          fi
          echo "$MACH_INSTALL_DIR" >> "$GITHUB_PATH"
      - run: mach dep pull .
      - run: mach build . -t "$TARGET" -p release
        env:
          TARGET: ${{ matrix.target }}
      - name: package
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          version=${GITHUB_REF_NAME#v}
          mkdir dist pkg
          cp LICENSE pkg/
          if [ "$RUNNER_OS" = Windows ]; then
            cp "out/$TARGET/release/bin/mls.exe" pkg/
            (cd pkg && 7z a -tzip -bso0 "../dist/mls-$version-$ASSET.zip" mls.exe LICENSE)
          else
            cp "out/$TARGET/release/bin/mls" pkg/
            tar -czf "dist/mls-$version-$ASSET.tar.gz" -C pkg mls LICENSE
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [verify, ci, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # every tag and the pinned mach, for RELEASES.json
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git submodule update --init --depth 1 dep/mach
          python3 .github/release/releases.py "${GITHUB_REF_NAME#v}" dist/RELEASES.json
          (cd dist && sha256sum * > SHA256SUMS)
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # a doubled tag push waits on the concurrency group, then finds the release
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "release $TAG already exists"
            exit 0
          fi
          # notes are the changelog section for this version when there is one
          notes=$(awk -v v="${TAG#v}" '/^## \[/ { on = index($0, "[" v "]") > 0; next } on' CHANGELOG.md 2>/dev/null || true)
          flags=(--verify-tag --title "$TAG" --draft)
          [ -n "$notes" ] && flags+=(--notes "$notes") || flags+=(--generate-notes)
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" dist/* "${flags[@]}"
          gh release edit "$TAG" --draft=false
