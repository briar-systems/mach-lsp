name: CI

# the family contract: briar-systems/.github README. light legs run on every
# pull request into dev, heavy legs on a pull request into main, on a dispatch
# that names them, and on a release, which calls this workflow with heavy=all.
#
# windows is light as well as linux (ruled 2026-09-16): path identity there is
# lexical - drive roots, UNC authorities, native separators - and none of it is
# exercised by a linux build, where `\` is an ordinary character (#157).

on:
  pull_request:
  workflow_call:
    inputs:
      heavy:
        type: string
        default: none
  workflow_dispatch:
    inputs:
      heavy:
        description: heavy work to run on this ref
        type: choice
        default: none
        options: [none, all, aarch64-linux, x86_64-windows, aarch64-darwin, x86_64-darwin]

permissions:
  contents: read

jobs:
  # the protocol suite runs from .github/ci/verify.sh against each leg's own
  # debug binary
  lib:
    uses: briar-systems/.github/.github/workflows/mach-lib.yml@main
    with:
      heavy: ${{ inputs.heavy }}
      submodules: "true"
      light-legs: '["x86_64-windows"]'
      mach-version: v6.0.0

  gate:
    if: always()
    needs: [lib]
    runs-on: ubuntu-latest
    steps:
      - uses: briar-systems/.github/.github/actions/gate@main
        with:
          needs: ${{ toJSON(needs) }}
